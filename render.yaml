services:
  # ── Django Backend ─────────────────────────────────────────────────────────
  - type: web
    name: assessment-hub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py load_questions
    startCommand: python start_server.py
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random secret key
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: assessment-hub-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://assessment-hub-frontend.onrender.com

  # ── React Frontend ──────────────────────────────────────────────────────────
  - type: static
    name: assessment-hub-frontend
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://assessment-hub-backend.onrender.com/api
