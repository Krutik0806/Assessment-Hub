services:
  # ── Django Backend ─────────────────────────────────────────────────────────
  - type: web
    name: assessment-hub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_all_tests
    startCommand: python start_server.py
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random secret key
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: assessment-hub-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://assessment-hub-frontend.onrender.com
